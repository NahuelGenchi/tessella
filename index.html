<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tessella</title>
<meta name="description" content="Colour by number and pixel art, from asset packs you open on your own computer. Nothing is uploaded.">
<meta name="theme-color" content="#e8ecf3">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Tessella">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one-screen app. Graph-paper stage between a slim top bar and a thumb-reach dock. */
  --paper:#e8ecf3;
  --surface:#ffffff;
  --raise:#f2f4f9;
  --ink:#18202e;
  --muted:#657084;
  --line:#d3d9e4;
  --accent:#ff4d2e;
  --accent-ink:#ffffff;
  --display:"Pixelify Sans",ui-monospace,"SF Mono",Menlo,monospace;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10131a;--surface:#1a1f2a;--raise:#232a37;--ink:#eef1f6;--muted:#8f9aae;--line:#2d3545;--accent:#ff6a4d;--accent-ink:#1a0d08;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10131a;--surface:#1a1f2a;--raise:#232a37;--ink:#eef1f6;--muted:#8f9aae;--line:#2d3545;--accent:#ff6a4d;--accent-ink:#1a0d08;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}

/* ---------- home ---------- */
#home{top:env(safe-area-inset-top,0px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  gap:18px}
.wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:max(8px,calc(20px - env(safe-area-inset-top,0px)))}
.hero{display:flex;align-items:center;gap:16px}
.hero canvas{width:84px;height:84px;flex:none;background:var(--surface);image-rendering:pixelated;border-radius:6px;box-shadow:0 0 0 3px var(--ink)}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,52px);line-height:.95;letter-spacing:-.01em;text-wrap:balance}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);font-size:15px;margin-top:6px;max-width:34ch}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.tab{flex:1;min-height:44px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted)}
.tab{display:flex;align-items:center;justify-content:center}
.tab img{width:36px;height:36px;image-rendering:pixelated;pointer-events:none}
.tab img.wide{height:30px}
.tab.on{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;gap:10px;position:relative;transition:transform .12s}
.card:active{transform:scale(.97)}
.thumb{aspect-ratio:1;border-radius:9px;overflow:hidden;display:grid;place-items:center;
  background:conic-gradient(var(--raise) 25%,var(--surface) 0 50%,var(--raise) 0 75%,var(--surface) 0) 0 0/16px 16px}
.thumb canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
.cap{display:flex;flex-direction:column;gap:1px;padding:0 2px 2px}
.cap strong{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.cap span{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.pill{position:absolute;top:16px;left:16px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;font-variant-numeric:tabular-nums}
.pill.done{background:var(--accent);color:var(--accent-ink)}
.card.new{border-style:dashed;border-width:2px;align-items:center;justify-content:center;text-align:center;min-height:190px;color:var(--ink)}
.card.new .plus{font-family:var(--display);font-size:54px;line-height:1;color:var(--accent)}
.card.new span{color:var(--muted);font-size:13px}
.note{grid-column:1/-1;color:var(--muted);font-size:14px;padding:4px 2px}

/* ---------- workspace (play + edit) ---------- */
.bar{display:flex;align-items:center;gap:6px;background:var(--surface);border-bottom:1px solid var(--line);
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));position:relative}
.ib{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:active{background:var(--raise)}
.ib.on{background:var(--ink);color:var(--paper)}
.ib:disabled{opacity:.3}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 4px}
.ttl strong{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{position:absolute;left:0;bottom:-1px;height:3px;background:var(--accent);width:0;transition:width .2s}
#artName{flex:1;min-width:0;height:42px;border:1px solid transparent;background:transparent;border-radius:10px;padding:0 8px;font-weight:600;font-size:16px;-webkit-user-select:text;user-select:text}
#artName:focus{border-color:var(--line);background:var(--raise);outline:none}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;
  background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/20px 20px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/20px 20px,var(--paper)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.dock{background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;
  padding:10px max(10px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.swatches{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.swatches::-webkit-scrollbar{display:none}
.sw{flex:none;width:50px;height:50px;border-radius:13px;border:1px solid rgba(0,0,0,.18);display:grid;place-items:center;
  font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;transition:transform .12s;position:relative}
.sw small{position:absolute;bottom:3px;font-size:9.5px;font-weight:600;opacity:.8}
.sw.on{transform:translateY(-4px);box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--ink)}
.sw.fin{opacity:.35}
.ed .sw{width:40px;height:40px;border-radius:11px}
.ed .sw.on{transform:none}
.tools{display:flex;gap:4px;justify-content:space-between}
.tool{flex:1;min-width:0;min-height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted)}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool.on{background:var(--ink);color:var(--paper)}
.palrow{display:flex;gap:10px;align-items:center}
.cur{flex:none;width:50px;height:50px;border-radius:14px;border:2px solid var(--ink);position:relative;overflow:hidden;display:grid;place-items:center}
.cur input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.cur span{font-family:var(--display);font-size:22px;line-height:1;pointer-events:none;text-shadow:0 0 3px rgba(0,0,0,.5);color:#fff}
.palrow .swatches{flex:1;min-width:0}
.donebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.donebar strong{font-family:var(--display);font-size:24px;flex:1;min-width:120px}
.btn{min-height:46px;padding:0 18px;border-radius:13px;font-weight:600;background:var(--raise);border:1px solid var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--accent)}

/* ---------- sheet + toast ---------- */
.sheet{position:fixed;inset:0;background:rgba(10,14,22,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet-card{background:var(--surface);width:100%;max-width:460px;border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;
  padding:20px 16px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:rise .2s ease-out}
@media (min-width:560px){.sheet{align-items:center}.sheet-card{border-radius:22px}}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-card h2{font-family:var(--display);font-size:26px;line-height:1.1}
.sheet-card p{color:var(--muted);font-size:14.5px}
.sheet-card .btn{width:100%;text-align:left}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.sizes .btn{text-align:center;font-variant-numeric:tabular-nums;padding:0 6px}
.sizes .btn.on{background:var(--ink);color:var(--paper);border-color:transparent}
.cut{position:relative;overflow:auto;max-height:44vh;border-radius:10px;border:1px solid var(--line);-webkit-overflow-scrolling:touch;
  background:conic-gradient(var(--raise) 25%,var(--surface) 0 50%,var(--raise) 0 75%,var(--surface) 0) 0 0/16px 16px}
.cut canvas{display:block;max-width:none;image-rendering:pixelated;cursor:pointer}
.cutgrid{position:absolute;left:0;top:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,77,46,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(255,77,46,.55) 1px,transparent 1px)}
.find{width:100%;height:46px;border:1px solid var(--line);background:var(--raise);border-radius:13px;padding:0 14px;-webkit-user-select:text;user-select:text}
/* ---------- assets ---------- */
.abar{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;flex-direction:column;gap:10px;padding:10px 0;margin:-10px 0}
.ahead{display:flex;align-items:center;gap:8px}
.ahead .ttl{padding:0 2px}
.ahead .ttl strong{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);
  font-weight:600;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip small{font-weight:500;font-size:12px;opacity:.7;margin-left:6px}
.chip.on{background:var(--ink);color:var(--paper);border-color:transparent}
.chips.sub{margin-top:-4px}
.chips.sub .chip{min-height:32px;padding:0 12px;font-size:13px;background:transparent}
.chips.sub .chip.on{background:var(--accent);color:var(--accent-ink)}
.grid.dense{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.dense .card{min-width:0;padding:8px;gap:8px;border-radius:14px}
.card.as{content-visibility:auto;contain-intrinsic-size:auto 168px}
.dense .cap{min-width:0}
.dense .cap strong{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dense .cap span{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb img{width:100%;height:100%;padding:6px;object-fit:contain;image-rendering:pixelated;display:block;opacity:0;transition:opacity .22s}
.thumb img.soft{image-rendering:auto}
.thumb img.in{opacity:1}
.card.new.wide{grid-column:1/-1;min-height:210px}
.more{grid-column:1/-1;height:1px}
.pick{text-align:left;border-radius:10px}
.pick strong{display:flex;align-items:center;gap:6px}
.pick strong span{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:inherit;color:inherit}
.pick strong svg{flex:none;width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hero .ib{margin-left:auto;align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.sheet-card .trow{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px}
.trow.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.trow .dots{display:flex;flex:none;padding-left:8px}
.trow .dots i{width:24px;height:24px;border-radius:50%;border:2px solid var(--raise);margin-left:-8px}
.trow .mimg{width:40px;height:40px;border-radius:10px;flex:none}
.sheet-card h3{font-family:var(--display);font-size:19px;line-height:1.2;margin-top:8px}
.sheet-card h4{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.mpick{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;padding:8px 4px 6px;border-radius:14px;border:2px solid transparent;background:none;color:var(--ink);font:inherit;font-size:11.5px;line-height:1.2;cursor:pointer}
.mpick img{width:56px;height:56px;border-radius:13px;box-shadow:0 2px 6px rgba(0,0,0,.16)}
.mpick span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpick.on{border-color:var(--accent);background:var(--raise)}
.mpick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.trow .nm{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.trow .nm b{font-weight:600}
.trow .nm small{font-size:12.5px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.trow .tick{flex:none;font-weight:700;font-size:18px;color:var(--accent)}
.piece{display:flex;align-items:center;gap:10px}
.piece canvas{flex:none;width:50px;height:50px;object-fit:contain;image-rendering:pixelated;border-radius:11px;border:1px solid var(--line);
  background:conic-gradient(var(--raise) 25%,var(--surface) 0 50%,var(--raise) 0 75%,var(--surface) 0) 0 0/12px 12px}
.piece .btn{flex:none;padding:0 16px}
.btn:disabled{opacity:.4;cursor:default}
.shot{width:100%;max-height:46vh;object-fit:contain;image-rendering:pixelated;border-radius:10px;border:1px solid var(--line);
  background:conic-gradient(var(--raise) 25%,var(--surface) 0 50%,var(--raise) 0 75%,var(--surface) 0) 0 0/16px 16px;
  -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:12px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(180deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">

  <section id="home" class="view on">
    <div class="wrap">
      <header class="hero">
        <canvas id="heroArt" width="16" height="16" aria-hidden="true"></canvas>
        <div>
          <h1>Tes<span>sella</span></h1>
          <p>Colour pictures by number, or draw your own pixel art.</p>
        </div>
        <button class="ib" id="themeBtn" type="button" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.7-.8 1.7-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.4-.7-.4-1.1 0-1 .8-1.7 1.7-1.7H17a4 4 0 0 0 4-4c0-4.6-4-8.3-9-8.3z"/><circle cx="7.5" cy="12" r="1" fill="currentColor"/><circle cx="9.5" cy="7.8" r="1" fill="currentColor"/><circle cx="14.5" cy="7.3" r="1" fill="currentColor"/></svg></button>
      </header>
      <div class="tabs" role="tablist">
        <button class="tab on" id="tabColour" role="tab" type="button" aria-label="Colour" title="Colour"><img src="icons/tabs/tab-colour.png" alt=""></button>
        <button class="tab" id="tabArt" role="tab" type="button" aria-label="My art" title="My art"><img src="icons/tabs/tab-art.png" alt=""></button>
        <button class="tab" id="tabAssets" role="tab" type="button" aria-label="Assets" title="Assets"><img class="wide" src="icons/tabs/tab-assets.png" alt=""></button>
      </div>
      <div class="abar" id="assetBar" hidden>
        <div class="ahead">
          <button class="ttl pick" id="packPick" type="button" aria-label="Choose a pack"><strong><span id="packName"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></strong><span id="packCount"></span></button>
          <button class="ib" id="packMore" type="button" aria-label="Pack options"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></svg></button>
        </div>
        <input class="find" id="packFind" type="search" placeholder="Search pictures" autocomplete="off" aria-label="Search pictures">
        <div class="chips" id="packChips"></div>
        <div class="chips sub" id="packSubs" hidden></div>
      </div>
      <input id="packInput" type="file" accept=".zip,application/zip" hidden>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section id="play" class="view">
    <header class="bar">
      <button class="ib" id="playBack" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ttl"><strong id="playName"></strong><span id="playPct"></span></div>
      <button class="ib" id="playFind" type="button" aria-label="Find a square of this colour"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button class="ib" id="playMove" type="button" aria-label="Move the picture" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg></button>
      <button class="ib" id="playFit" type="button" aria-label="Fit picture to screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      <button class="ib" id="playMore" type="button" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></svg></button>
      <div class="prog" id="playProg"></div>
    </header>
    <div class="stage" id="playStage"><canvas></canvas><div class="confetti" id="confetti"></div></div>
    <footer class="dock">
      <div class="swatches" id="playSw"></div>
      <div class="donebar" id="doneBar" hidden>
        <strong>Finished!</strong>
        <button class="btn" id="doneAgain" type="button">Colour again</button>
        <button class="btn pri" id="doneSave" type="button">Save picture</button>
      </div>
    </footer>
  </section>

  <section id="edit" class="view ed">
    <header class="bar">
      <button class="ib" id="edBack" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <input id="artName" type="text" maxlength="30" aria-label="Drawing name" autocomplete="off">
      <button class="ib" id="edUndo" type="button" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M8 5L3 10l5 5"/><path d="M3 10h11a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="ib" id="edRedo" type="button" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M16 5l5 5-5 5"/><path d="M21 10H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button class="ib" id="edMore" type="button" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></svg></button>
    </header>
    <div class="stage" id="edStage"><canvas></canvas></div>
    <footer class="dock">
      <div class="tools" id="tools">

(function(){

/* ---------- built-in pictures (original 16 x 16 designs) ---------- */
const RAW=[
 {id:'heart',name:'Heart',key:{'.':'#cfe8ff',k:'#4a1226',r:'#f0364a',d:'#b81d3a',w:'#ffc2d1'},rows:[

 {id:'duck',name:'Duck',key:{'.':'#d6f0ff',y:'#ffd43b',s:'#f2a900',o:'#ff7a1a',k:'#2b2b33',b:'#3aa0e8'},rows:[

 {id:'apple',name:'Apple',key:{'.':'#d7f5e3',r:'#e63946',d:'#a61e2d',w:'#ffb3ba',n:'#6b4423',g:'#4caf50'},rows:[

  "..rrrrrrrrrdd...","...rrrrrrrdd....","....rrr.rrr.....","................"]}
];
const BUILT=RAW.map(p=>{
  const w=16,h=p.rows.length,palette=[],idx={},cells=[];
  p.rows.forEach(row=>{
    row=row.padEnd(w,'.').slice(0,w);
    for(const ch of row){
      const k=p.key[ch]?ch:'.';
      if(idx[k]===undefined){idx[k]=palette.length;palette.push(p.key[k]);}
      cells.push(idx[k]);
    }
  });
  return {id:p.id,name:p.name,w,h,palette,cells};
});

/* ---------- helpers ---------- */
function lum(hex){const n=parseInt(hex.slice(1),16);return(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255;}
function greyOf(hex){const v=Math.round(255-(1-lum(hex))*255*0.36);return'rgb('+v+','+v+','+v+')';}
function hash(str){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return String(h);}
function sigOf(pz){return pz.w+'x'+pz.h+':'+hash(pz.palette.join()+pz.cells.join());}
function line(x0,y0,x1,y1,fn){
  const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let err=dx-dy;
  for(;;){fn(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>-dy){err-=dy;x0+=sx;}if(e2<dx){err+=dx;y0+=sy;}}
}
function pixelCanvas(w,h,colorAt,scale){
  scale=scale||1;const c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;const x=c.getContext('2d');
  for(let i=0;i<w*h;i++){const col=colorAt(i);if(col){x.fillStyle=col;x.fillRect((i%w)*scale,Math.floor(i/w)*scale,scale,scale);}}
  return c;
}
let toastT=0;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400);}

/* ---------- sheet ---------- */
const sheet=$('sheet'),sheetCard=$('sheetCard');
function openSheet(build){sheetCard.innerHTML='';build(sheetCard);sheet.hidden=false;}
function closeSheet(){sheet.hidden=true;sheetCard.innerHTML='';}
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet();});
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function sheetBtn(parent,label,fn,cls){const b=el('button','btn'+(cls?' '+cls:''),label);b.type='button';b.addEventListener('click',fn);parent.append(b);return b;}

/* ---------- saving pictures ---------- */
let downloads=null;
try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{downloads=d;}).catch(()=>{});}catch(e){}
function exportSheet(name,w,h,colorAt){
  const scale=Math.max(1,Math.floor(1024/Math.max(w,h)));
  const c=pixelCanvas(w,h,colorAt,scale);
  openSheet(card=>{
    card.append(el('h2','',name));
    const img=el('img','shot');img.alt=name;img.src=c.toDataURL('image/png');card.append(img);
    card.append(el('p','','Touch and hold the picture to save or copy it.'));
    // inside claude.ai a page can only save through its downloads helper; on a normal website a download link does it
    if(downloads||!window.claude){
      sheetBtn(card,'Save as PNG',()=>{
        c.toBlob(b=>{
          if(!b){toast('Could not make the image.');return;}
          const file=(name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'pixel-art')+'.png';
          if(!downloads){
            const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=file;
            document.body.append(a);a.click();a.remove();
            setTimeout(()=>URL.revokeObjectURL(a.href),10000);
            toast('Saved');return;
          }
          downloads.save({filename:file,data:b}).then(()=>toast('Saved')).catch(err=>{
            if(!err||err.code!=='declined')toast('Saving is not available here. Touch and hold the picture instead.');
          });
        },'image/png');
      },'pri');
    }
    sheetBtn(card,'Close',closeSheet);
  });
}

/* ---------- zoomable board ---------- */
class Board{
  constructor(stage){
    this.stage=stage;this.cv=stage.querySelector('canvas');this.ctx=this.cv.getContext('2d');
    this.w=16;this.h=16;this.s=20;this.ox=0;this.oy=0;this.cw=0;this.ch=0;
    this.isFit=true;this.pan=false;this.pts=new Map();this.mode=null;this.raf=0;this.last=null;this.minS=2;this.tap=null;this.gl=null;
    new ResizeObserver(()=>this.resize()).observe(stage);
    const cv=this.cv;
    cv.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button>1)return;
      e.preventDefault();this.gl=null;
      try{cv.setPointerCapture(e.pointerId);}catch(_){}
      this.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(this.pts.size===1){
        if(this.pan||e.button===1){this.mode='pan';this.tap={x:e.clientX,y:e.clientY};}
        else{this.mode='draw';this.drawId=e.pointerId;this.last=null;this.t0=performance.now();if(this.onStart)this.onStart();this.stroke(e);}
      }else if(this.pts.size===2){
        this.tap=null;
        if(this.mode==='draw'){this.mode=null;if(this.onEnd)this.onEnd(performance.now()-this.t0<350);}
        const p=[...this.pts.values()];
        this.p0={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1,cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2,s:this.s,ox:this.ox,oy:this.oy};
        this.mode='pinch';
      }
    });
    cv.addEventListener('pointermove',e=>{
      const p=this.pts.get(e.pointerId);if(!p)return;
      const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
      if(this.mode==='draw'&&e.pointerId===this.drawId){this.stroke(e);}
      else if(this.mode==='pan'){
        if(this.tap){if(Math.hypot(e.clientX-this.tap.x,e.clientY-this.tap.y)<8)return;this.tap=null;}
        this.ox+=dx;this.oy+=dy;this.isFit=false;this.clamp();this.draw();}
      else if(this.mode==='pinch'&&this.pts.size>=2){
        const q=[...this.pts.values()],r=cv.getBoundingClientRect(),p0=this.p0;
        const d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y)||1,cx=(q[0].x+q[1].x)/2,cy=(q[0].y+q[1].y)/2;
        const ns=this.limit(p0.s*d/p0.d);
        const wx=(p0.cx-r.left-p0.ox)/p0.s,wy=(p0.cy-r.top-p0.oy)/p0.s;
        this.s=ns;this.ox=cx-r.left-wx*ns;this.oy=cy-r.top-wy*ns;this.isFit=false;this.clamp();this.draw();
      }
    });
    const up=e=>{
      if(!this.pts.has(e.pointerId))return;
      if(this.mode==='pan'&&this.tap&&this.onTap&&e.type==='pointerup'){const c=this.cellAt(e.clientX,e.clientY);if(c)this.onTap(c.x,c.y);}
      this.tap=null;this.pts.delete(e.pointerId);
      if(this.mode==='draw'&&e.pointerId===this.drawId){this.mode=null;if(this.onEnd)this.onEnd(false);}
      if(this.pts.size===0)this.mode=null;
      else if(this.mode==='pinch'&&this.pts.size<2)this.mode='wait';
    };
    cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
    cv.addEventListener('wheel',e=>{e.preventDefault();this.gl=null;const r=cv.getBoundingClientRect();this.zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*0.002));},{passive:false});
    cv.addEventListener('contextmenu',e=>e.preventDefault());
  }
  setSize(w,h){this.w=w;this.h=h;this.isFit=true;this.resize();}
  resize(){
    const r=this.stage.getBoundingClientRect();if(r.width<2||r.height<2)return;
    const d=window.devicePixelRatio||1;this.cw=r.width;this.ch=r.height;
    this.cv.width=Math.round(r.width*d);this.cv.height=Math.round(r.height*d);
    if(this.isFit)this.fit();else{this.clamp();this.render();}
  }
  fitScale(){return Math.max(this.minS,Math.min((this.cw-28)/this.w,(this.ch-28)/this.h));}
  limit(s){const f=this.fitScale();return Math.min(Math.max(f*4,64),Math.max(f*0.6,s));}
  fit(){this.s=this.fitScale();this.ox=(this.cw-this.w*this.s)/2;this.oy=(this.ch-this.h*this.s)/2;this.isFit=true;this.render();}
  clamp(){const m=56,W=this.w*this.s,H=this.h*this.s;this.ox=Math.min(this.cw-m,Math.max(m-W,this.ox));this.oy=Math.min(this.ch-m,Math.max(m-H,this.oy));}
  zoomAt(px,py,f){const ns=this.limit(this.s*f),wx=(px-this.ox)/this.s,wy=(py-this.oy)/this.s;this.s=ns;this.ox=px-wx*ns;this.oy=py-wy*ns;this.isFit=false;this.clamp();this.draw();}
  centerOn(x,y,minS){this.s=this.limit(Math.max(this.s,minS));this.ox=this.cw/2-(x+.5)*this.s;this.oy=this.ch/2-(y+.5)*this.s;this.isFit=false;this.clamp();this.draw();}
  glideTo(cx,cy,minS){
    const ns=this.limit(Math.max(this.s,minS)),m=56;
    const tx=Math.min(this.cw-m,Math.max(m-this.w*ns,this.cw/2-cx*ns)),ty=Math.min(this.ch-m,Math.max(m-this.h*ns,this.ch/2-cy*ns));
    this.isFit=false;
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){this.s=ns;this.ox=tx;this.oy=ty;this.render();return;}
    const a={s:this.s,ox:this.ox,oy:this.oy},t0=performance.now();
    const step=()=>{
      if(this.gl!==step)return;
      const k=Math.min(1,(performance.now()-t0)/260),e=1-Math.pow(1-k,3);
      this.s=a.s+(ns-a.s)*e;this.ox=a.ox+(tx-a.ox)*e;this.oy=a.oy+(ty-a.oy)*e;this.render();
      if(k<1)requestAnimationFrame(step);else this.gl=null;
    };
    this.gl=step;step();
  }
  cellAt(cx,cy){const r=this.cv.getBoundingClientRect();const x=Math.floor((cx-r.left-this.ox)/this.s),y=Math.floor((cy-r.top-this.oy)/this.s);return(x<0||y<0||x>=this.w||y>=this.h)?null:{x,y};}
  stroke(e){
    const c=this.cellAt(e.clientX,e.clientY);if(!c){this.last=null;return;}
    const l=this.last;
    if(l){if(l.x!==c.x||l.y!==c.y)line(l.x,l.y,c.x,c.y,(x,y)=>{if(x!==l.x||y!==l.y)this.onCell(x,y);});}
    else this.onCell(c.x,c.y);
    this.last=c;
  }
  X(x){return Math.round(this.ox+x*this.s);}
  Y(y){return Math.round(this.oy+y*this.s);}
  range(){return{x0:Math.max(0,Math.floor(-this.ox/this.s)),y0:Math.max(0,Math.floor(-this.oy/this.s)),
    x1:Math.min(this.w,Math.ceil((this.cw-this.ox)/this.s)),y1:Math.min(this.h,Math.ceil((this.ch-this.oy)/this.s))};}
  gridLines(ctx,color){
    if(this.s<5)return;const g=this.range();ctx.fillStyle=color;
    for(let x=g.x0;x<=g.x1;x++)ctx.fillRect(this.X(x),this.Y(g.y0),1,this.Y(g.y1)-this.Y(g.y0));
    for(let y=g.y0;y<=g.y1;y++)ctx.fillRect(this.X(g.x0),this.Y(y),this.X(g.x1)-this.X(g.x0)+1,1);
  }
  frame(ctx){ctx.strokeStyle='rgba(16,22,34,.55)';ctx.lineWidth=2;ctx.strokeRect(this.X(0)-1,this.Y(0)-1,this.X(this.w)-this.X(0)+2,this.Y(this.h)-this.Y(0)+2);}
  draw(){if(this.raf)return;this.raf=requestAnimationFrame(()=>{this.raf=0;this.render();});}
  render(){const d=window.devicePixelRatio||1,c=this.ctx;c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,this.cw,this.ch);if(this.paint)this.paint(c,this);}
}

/* ---------- views ---------- */
let current='home';
let homeY=0,homeYTab='';
function show(v){
  if(current==='home'&&v!=='home'){homeY=$('home').scrollTop;homeYTab=homeTab;}
  current=v;['home','play','edit','asset'].forEach(id=>$(id).classList.toggle('on',id===v));
  if(v==='home'){renderHome();if(homeYTab===homeTab)$('home').scrollTop=homeY;}
}

/* ---------- progress ---------- */
let prog=store.get('pxp.prog',{});
function loadDone(pz){
  const n=pz.w*pz.h,d=new Uint8Array(n),p=prog[pz.id];
  if(p&&p.sig===sigOf(pz)&&p.d.length===n)for(let i=0;i<n;i++)d[i]=p.d.charCodeAt(i)===49?1:0;
  return d;
}
function saveDone(pz,d){let s='';for(let i=0;i<d.length;i++)s+=d[i]?'1':'0';prog[pz.id]={sig:sigOf(pz),d:s};store.set('pxp.prog',prog);}
function pctOf(pz,d){let t=0,f=0;for(let i=0;i<d.length;i++)if(pz.cells[i]>=0){t++;if(d[i])f++;}return t?Math.floor(f*100/t):0;}

/* ---------- home ---------- */
let arts=store.get('pxp.arts',[]);
if(!Array.isArray(arts))arts=[];
function saveArts(){store.set('pxp.arts',arts);}
let homeTab=store.get('pxp.tab','colour');if(!['colour','art','assets'].includes(homeTab))homeTab='colour';
const grid=$('grid');
function puzzleThumb(pz,d){const greys=pz.palette.map(greyOf);return pixelCanvas(pz.w,pz.h,i=>{const t=pz.cells[i];return t<0?null:(d[i]?pz.palette[t]:greys[t]);});}
function makeCard(canvas,name,meta,pill,done,fn){
  const b=el('button','card');b.type='button';
  const th=el('div','thumb');th.append(canvas);b.append(th);
  const cap=el('div','cap');cap.append(el('strong','',name),el('span','',meta));b.append(cap);
  if(pill){b.append(el('span','pill'+(done?' done':''),pill));}
  b.addEventListener('click',fn);return b;
}
function renderHome(){
  [['tabColour','colour'],['tabArt','art'],['tabAssets','assets']].forEach(([id,k])=>{$(id).classList.toggle('on',homeTab===k);$(id).setAttribute('aria-selected',homeTab===k);});
  $('assetBar').hidden=!(homeTab==='assets'&&pack);
  if(homeTab==='assets'){renderAssets();return;}
  as.key='';thumbQ.length=0;thumbIO.disconnect();moreIO.disconnect();
  grid.classList.remove('dense');grid.innerHTML='';
  if(homeTab==='colour'){
    BUILT.forEach(pz=>{
      const d=loadDone(pz),p=pctOf(pz,d);
      grid.append(makeCard(puzzleThumb(pz,d),pz.name,pz.w+' × '+pz.h+' · '+pz.palette.length+' colours',p===100?'Done':(p>0?p+'%':''),p===100,()=>openPuzzle(pz,'home')));
    });
    grid.append(el('p','note','Draw something in My art and you can colour it by number too.'));
  }else{
    const n=el('button','card new');n.type='button';
    n.append(el('div','plus','+'),el('strong','','New drawing'),el('span','','Start with a blank canvas'));
    n.addEventListener('click',newArtSheet);grid.append(n);
    const o=el('button','card new');o.type='button';
    o.append(el('div','plus','↑'),el('strong','','Open a picture'),el('span','','From this device'));
    o.addEventListener('click',openPictureSheet);grid.append(o);
    arts.forEach(a=>{

/* ---------- colour by number ---------- */
const playBoard=new Board($('playStage'));
const play={pz:null,done:null,sel:0,left:[],total:0,filled:0,complete:false,from:'home',strokeCells:[],flash:null,greys:[]};
function openPuzzle(pz,from){
  play.pz=pz;play.from=from;play.done=loadDone(pz);play.greys=pz.palette.map(greyOf);
  play.left=pz.palette.map(()=>0);play.total=0;play.filled=0;play.flash=null;
  for(let i=0;i<pz.cells.length;i++){const t=pz.cells[i];if(t>=0){play.total++;if(play.done[i])play.filled++;else play.left[t]++;}}
  play.complete=play.filled===play.total;
  play.sel=Math.max(0,play.left.findIndex(n=>n>0));
  $('playName').textContent=pz.name;
  setPlayPan(false);buildPlaySwatches();updatePlayUI();
  show('play');playBoard.setSize(pz.w,pz.h);
}
function buildPlaySwatches(){
  const box=$('playSw');box.innerHTML='';
  play.pz.palette.forEach((hex,i)=>{
    const b=el('button','sw');b.type='button';b.style.background=hex;b.style.color=lum(hex)>0.62?'#18202e':'#ffffff';
    b.setAttribute('aria-label','Colour '+(i+1));
    b.append(el('b','',String(i+1)),el('small','',''));
    b.addEventListener('click',()=>selectColour(i,true));box.append(b);
  });
}
function selectColour(i,scroll){
  play.sel=i;updatePlayUI();playBoard.draw();
  if(scroll){const b=$('playSw').children[i];if(b&&b.scrollIntoView)b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});}
}
function updatePlayUI(){
  const kids=$('playSw').children;
  for(let i=0;i<kids.length;i++){
    const fin=play.left[i]===0;
    kids[i].classList.toggle('on',i===play.sel&&!play.complete);kids[i].classList.toggle('fin',fin);
    kids[i].firstChild.textContent=fin?'✓':String(i+1);kids[i].lastChild.textContent=fin?'':play.left[i]+' left';
  }
  const p=play.total?Math.floor(play.filled*100/play.total):0;
  $('playPct').textContent=play.complete?'Finished':p+'% coloured';
  $('playProg').style.width=(play.total?play.filled*100/play.total:0)+'%';
  $('playSw').hidden=play.complete;$('doneBar').hidden=!play.complete;
  $('playFind').disabled=play.complete;
}
playBoard.onStart=()=>{play.strokeCells=[];};
playBoard.onCell=(x,y)=>{
  if(play.complete)return;
  const i=y*play.pz.w+x,t=play.pz.cells[i];
  if(t!==play.sel||play.done[i])return;
  play.done[i]=1;play.left[t]--;play.filled++;play.strokeCells.push(i);
  updatePlayUI();playBoard.draw();
};
playBoard.onEnd=cancel=>{
  if(cancel){play.strokeCells.forEach(i=>{play.done[i]=0;play.left[play.pz.cells[i]]++;play.filled--;});play.strokeCells=[];updatePlayUI();playBoard.draw();return;}
  if(!play.strokeCells.length)return;
  saveDone(play.pz,play.done);
  if(play.filled===play.total){play.complete=true;updatePlayUI();playBoard.fit();confetti();return;}
  if(play.left[play.sel]===0){
    const n=play.pz.palette.length;
    for(let k=1;k<=n;k++){const j=(play.sel+k)%n;if(play.left[j]>0){selectColour(j,true);break;}}
  }
};
playBoard.paint=(ctx,b)=>{
  const pz=play.pz;if(!pz)return;
  const g=b.range(),s=b.s,showNum=!play.complete&&s>=13;
  ctx.fillStyle='#ffffff';ctx.fillRect(b.X(0),b.Y(0),b.X(pz.w)-b.X(0),b.Y(pz.h)-b.Y(0));
  if(showNum){ctx.font='600 '+Math.round(s*0.46)+'px Onest, system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';}
  for(let y=g.y0;y<g.y1;y++){
    const py=b.Y(y),ph=b.Y(y+1)-py;
    for(let x=g.x0;x<g.x1;x++){
      const i=y*pz.w+x,t=pz.cells[i];if(t<0)continue;
      const px=b.X(x),pw=b.X(x+1)-px;
      if(play.done[i]){ctx.fillStyle=pz.palette[t];ctx.fillRect(px,py,pw,ph);continue;}
      const hot=t===play.sel;
      ctx.fillStyle=hot?'#7b8597':play.greys[t];ctx.fillRect(px,py,pw,ph);
      if(showNum){ctx.fillStyle=hot?'#ffffff':'#5b6474';ctx.fillText(String(t+1),px+pw/2,py+ph/2+1);}
    }
  }
  if(!play.complete)b.gridLines(ctx,'rgba(20,28,44,.16)');
  b.frame(ctx);
  if(play.flash){
    const e=performance.now()-play.flash.t0;
    if(e>1500)play.flash=null;
    else{
      const k=1+Math.abs(Math.sin(e/160))*0.5,cx=b.ox+(play.flash.x+.5)*s,cy=b.oy+(play.flash.y+.5)*s,r=s*k;
      ctx.strokeStyle=ACC;ctx.lineWidth=4;ctx.strokeRect(cx-r/2-2,cy-r/2-2,r+4,r+4);b.draw();
    }
  }
};
function setPlayPan(on){playBoard.pan=on;$('playMove').classList.toggle('on',on);$('playMove').setAttribute('aria-pressed',on);}
$('playMove').addEventListener('click',()=>{setPlayPan(!playBoard.pan);toast(playBoard.pan?'Drag to move. Tap again to colour.':'Back to colouring');});
$('playFit').addEventListener('click',()=>playBoard.fit());
$('playFind').addEventListener('click',()=>{
  const pz=play.pz,cx=(playBoard.cw/2-playBoard.ox)/playBoard.s,cy=(playBoard.ch/2-playBoard.oy)/playBoard.s;
  let best=-1,bd=1e9;
  for(let i=0;i<pz.cells.length;i++)if(pz.cells[i]===play.sel&&!play.done[i]){const d=Math.hypot(i%pz.w+.5-cx,Math.floor(i/pz.w)+.5-cy);if(d<bd){bd=d;best=i;}}
  if(best<0)return;
  const x=best%pz.w,y=Math.floor(best/pz.w);
  if(playBoard.s<22)playBoard.centerOn(x,y,26);
  play.flash={x,y,t0:performance.now()};playBoard.draw();
});
function restartPuzzle(){play.done.fill(0);saveDone(play.pz,play.done);openPuzzle(play.pz,play.from);}

function commit(snap){ed.undo.push(snap);if(ed.undo.length>60)ed.undo.shift();ed.redo=[];updateEdButtons();saveArts();}
function flood(x,y,col){
  const a=ed.art,c=a.cells,from=c[y*a.w+x];if(from===col)return false;
  const st=[y*a.w+x];
  while(st.length){
    const i=st.pop();if(c[i]!==from)continue;c[i]=col;
    const cx=i%a.w,cy=(i-cx)/a.w;
    if(cx>0)st.push(i-1);if(cx<a.w-1)st.push(i+1);if(cy>0)st.push(i-a.w);if(cy<a.h-1)st.push(i+a.w);
  }
  return true;
}
edBoard.onStart=()=>{ed.snap=ed.art.cells.slice();ed.n=0;ed.changed=false;};
edBoard.onCell=(x,y)=>{
  const a=ed.art,i=y*a.w+x,first=ed.n++===0;
  if(ed.tool==='pencil'){if(a.cells[i]!==ed.color){a.cells[i]=ed.color;ed.changed=true;}}
  else if(ed.tool==='eraser'){if(a.cells[i]!==null){a.cells[i]=null;ed.changed=true;}}
  else if(ed.tool==='fill'){if(first&&flood(x,y,ed.color))ed.changed=true;}
  else if(ed.tool==='pick'){if(first){if(a.cells[i]){setColor(a.cells[i],false);setTool('pencil');}else toast('That square is empty.');}}
  edBoard.draw();
};
edBoard.onEnd=cancel=>{
  if(cancel){ed.art.cells=ed.snap;edBoard.draw();return;}
  if(ed.changed)commit(ed.snap);
};
edBoard.paint=(ctx,b)=>{
  const a=ed.art;if(!a)return;const g=b.range();
  for(let y=g.y0;y<g.y1;y++){
    const py=b.Y(y),ph=b.Y(y+1)-py;
    for(let x=g.x0;x<g.x1;x++){
      const px=b.X(x),pw=b.X(x+1)-px,c=a.cells[y*a.w+x];
      ctx.fillStyle=c||((x+y)%2?'#eceff4':'#ffffff');ctx.fillRect(px,py,pw,ph);
    }
  }
  if(ed.grid)b.gridLines(ctx,'rgba(20,28,44,.14)');
  b.frame(ctx);
};
function undo(){if(!ed.undo.length)return;ed.redo.push(ed.art.cells.slice());ed.art.cells=ed.undo.pop();updateEdButtons();saveArts();edBoard.draw();}
function redo(){if(!ed.redo.length)return;ed.undo.push(ed.art.cells.slice());ed.art.cells=ed.redo.pop();updateEdButtons();saveArts();edBoard.draw();}

    let armed=false;
    const del=sheetBtn(card,'Delete this drawing',()=>{
      if(!armed){armed=true;del.textContent='Tap again to delete for good';return;}
      arts=arts.filter(x=>x!==a);saveArts();delete prog['art-'+a.id];store.set('pxp.prog',prog);
      ed.art=null;closeSheet();homeTab='art';show('home');
    },'danger');
    sheetBtn(card,'Close',closeSheet);
  });
});

/* ---------- boot ---------- */
document.addEventListener('gesturestart',e=>e.preventDefault());
setColor(ed.color,false);
(function(){
  wearMascot();
  const t=store.get('pxp.theme',null);
  if(themeId!=='default'&&okTheme(t)&&t.id===themeId)applyTheme(t);else{themeId='default';drawHero('');}
})();
renderHome();
})();
</script>
</body>
</html>
